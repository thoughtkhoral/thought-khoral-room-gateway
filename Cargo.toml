[package]
name = "thought-khoral-room-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.44", features = ["serde"] }
jsonschema = { version = "=0.42.2", default-features = false }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = { version = "1.20.0", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = "0.3.34"
rand = "0.8.8"
rsa = "0.9.10"
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "handshake"] }
